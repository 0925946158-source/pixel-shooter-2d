<!DOCTYPE html>
<html>
<head>
    <title>Pixel Shooter 2D</title>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; overflow: hidden; }
        canvas { border: 2px solid white; background: #222; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="500" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let x = 230, y = 350; // প্লেয়ারের অবস্থান

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // স্ক্রিন পরিষ্কার করা
            ctx.fillStyle = 'lime'; 
            ctx.fillRect(x, y, 40, 40); // প্লেয়ার আঁকা
            requestAnimationFrame(draw);
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft') x -= 10;
            if(e.key === 'ArrowRight') x += 10;
        });

        draw();
    </script>
</body>
</html>
// গুলি এবং শত্রু যোগ করার কোড
const bullets = [];
const enemies = [];

window.addEventListener('mousedown', () => {
    bullets.push({ bx: x + 15, by: y, speed: 7 });
});

setInterval(() => {
    enemies.push({ ex: Math.random() * 460, ey: 0, speed: 2 });
}, 2000);
